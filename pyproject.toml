[project]
name = "aiocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JKKook", email = "104504666+JKKook@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=2.4.0",
    "kiwipiepy>=0.24.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pillow>=13.0.0",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.20.0",
    "rapidocr>=3.10.0",
    "sentence-transformers>=6.2.0",
    "tokenizers>=0.23.3",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
aiocr = "aiocr:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
